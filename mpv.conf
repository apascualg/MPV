autoload-files=no
### Profile ###
include="~~/profiles.conf"
profile=high-quality

### Video ###

priority=high

# Video output
vo=gpu-next

# API (DirectX recomendado en Windows)
gpu-api=d3d11
gpu-context=d3d11
d3d11-adapter=NVIDIA

# Hardware decoding
hwdec=d3d11va-copy

###### Scaling & Shaders ######

# Luma upscaling
glsl-shader="~~/shaders/ArtCNN_C4F16.glsl"
#glsl-shader="~~/shaders/ArtCNN_C4F32.glsl"

scale=ewa_lanczos
scale-blur=0.981251

# Luma downscaling
dscale=catmull_rom

# Antiringing
scale-antiring=0.5
dscale-antiring=0.5
cscale-antiring=0.5

###### Debanding ######

deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=4

###### Dithering ######

dither=error-diffusion
dither-depth=auto
error-diffusion=sierra-lite
temporal-dither=yes

###### Video Sync & Display ######

# Monitor refresh rate (6 × 23.976)
override-display-fps=143.856

# Best sync method for smooth playback
video-sync=audio

###### High-quality screenshots ######

screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-sw=no
screenshot-directory="C:\Users\apasc\Pictures"
screenshot-template="%f-%wH.%wM.%wS.%wT-#%#00n"

### Audio and Subtitles ###

slang=es,spa,es-ES,es-419
alang=ja,jp,jpn,jap,Japanese,en,eng,English

sub-auto=all
sub-fix-timing=yes
blend-subtitles=yes
sub-ass-override=yes

# Estilo Crunchyroll
sub-font="Trebuchet MS"
# Alternativas:
# sub-font="Arial"
# sub-font="Noto Sans"
# sub-font="Clear Sans"

sub-font-size=44
sub-margin-y=36

# Blanco puro
sub-color="#FFFFFFFF"

# Sin fondo
sub-back-color="#00000000"

# Borde negro grueso
sub-border-color="#000000"
sub-border-size=4

# Sombra
sub-shadow-color="#000000"
sub-shadow-offset=2

# Sin desenfoque
sub-blur=0

sub-file-paths=sub;subs;subtitles
sub-file-paths-append=subtitles
demuxer-mkv-subtitle-preroll=yes

### Audio ###

volume-max=150
audio-channels=auto
audio-file-auto=fuzzy
audio-pitch-correction=yes
audio-normalize-downmix=yes

# Dynamic audio normalization
af=lavfi=[dynaudnorm=g=3:f=250:r=0.9:p=0.9:m=10]

### Audio Filter Toggles ###

#af-toggle=@loudnorm:lavfi=[loudnorm=I=-16:TP=-3:LRA=4]
#af-toggle=@dynaudnorm:lavfi=[dynaudnorm=g=5:f=250:r=0.9:p=0.5]
#af-toggle=format:srate=48000

### General ###

osc=no
fullscreen=yes
snap-window
keep-open=yes
save-position-on-quit=yes
watch-later-dir="~~/cache/watch_later"

### OSD ###

border=no
osd-bar=no
osd-bold=yes
osd-font-size=37
osd-font='JetBrains Mono'

sub-ass-override=force
sub-font="Trebuchet MS"
sub-font-size=44
sub-margin-y=36
sub-color="red"
sub-back-color="#00000000"
sub-border-color="#000000"
sub-border-size=4
sub-shadow-color="#000000"
sub-shadow-offset=2
sub-blur=0