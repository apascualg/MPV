UP    add volume 2
DOWN  add volume -2

AXIS_UP add volume 2
AXIS_DOWN add volume -2
AXIS_LEFT seek -5
AXIS_RIGHT seek 5

[ multiply speed 0.95                # TODO: scale playback speed
] multiply speed 1.05
\ set speed 1.0

F5 write-watch-later-config; loadfile "${path}"

p seek 30 absolute-percent

ctrl+z revert_seek

r cycle-values video-rotate 0 90 180 270

X add audio-delay 0.100
Z add audio-delay -0.100
